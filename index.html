<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사다리타기 · im1l COFFEE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --im-pink:       #E46062;
  --im-pink-dark:  #c94a4c;
  --im-light-pink: #F3BCC0;
  --off-white:     #FFF8EE;
  --im-black:      #050202;
  --gray-100:      #f2f2f2;
  --gray-200:      #e4e4e4;
  --gray-400:      #b0b0b0;
  --gray-600:      #6b6b6b;
  --white:         #ffffff;
  --radius-sm:     10px;
  --radius-md:     18px;
  --radius-lg:     26px;
  --radius-xl:     34px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#e8ddd0;display:flex;justify-content:center;min-height:100dvh;font-family:'Noto Sans KR',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:430px;min-height:100dvh;background:var(--off-white);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.18)}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--off-white);transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s ease;will-change:transform,opacity}
.screen.hidden{transform:translateX(100%);opacity:0;pointer-events:none}
.screen.slide-out{transform:translateX(-40%);opacity:0;pointer-events:none}

/* status bar */
.sb{height:44px;display:flex;align-items:center;padding:0 20px;justify-content:space-between;flex-shrink:0;background:var(--off-white)}
.sb-time{font-size:14px;font-weight:700;color:var(--im-black)}

/* header */
.hdr{height:54px;display:flex;align-items:center;padding:0 16px;justify-content:space-between;flex-shrink:0;border-bottom:1.5px solid var(--im-light-pink);background:var(--off-white)}
.hdr-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;border-radius:50%;font-size:18px;color:var(--im-black);transition:background .15s}
.hdr-btn:active{background:var(--im-light-pink)}
.hdr-title{font-size:16px;font-weight:700;color:var(--im-black);letter-spacing:-.3px}

/* scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── S1 ── */
.hero-box{margin:20px 18px 0;background:var(--im-pink);border-radius:var(--radius-xl);height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;overflow:hidden}
.hero-logo{width:220px;object-fit:contain;filter:brightness(0) invert(1)}
.hero-sub{font-size:12px;color:rgba(255,255,255,.85);font-weight:500;letter-spacing:.5px}
.title-blk{text-align:center;padding:18px 18px 0}
.title-blk h1{font-size:24px;font-weight:700;color:var(--im-black)}
.title-blk p{font-size:13px;color:var(--gray-600);margin-top:4px}

/* compact layout: both steppers visible without scroll */
.steppers-wrap{padding:0 18px;margin-top:16px;display:flex;flex-direction:column;gap:14px}
.step-group{}
.step-lbl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.step-lbl{font-size:14px;font-weight:700;color:var(--im-black)}
.step-helper{font-size:12px;color:var(--gray-400)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--gray-100);border-radius:var(--radius-lg);padding:12px 18px}
.s-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--white);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--im-black);transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.09);user-select:none}
.s-btn:active{transform:scale(.93)}
.s-btn.dis{opacity:.3;cursor:not-allowed}
.s-btn.dis:active{transform:none}
.s-val{font-size:30px;font-weight:700;color:var(--im-black);min-width:56px;text-align:center}

/* bottom area */
.bot{padding:14px 18px 36px;flex-shrink:0;background:var(--off-white)}
.cta{width:100%;height:56px;border-radius:var(--radius-xl);border:none;font-size:16px;font-weight:700;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;letter-spacing:-.2px;font-family:'Noto Sans KR',sans-serif}
.cta.prime{background:var(--im-pink);color:#fff}
.cta.prime:active{background:var(--im-pink-dark);transform:scale(.98)}
.cta.sec{background:var(--gray-100);color:var(--gray-600)}
.cta.sec:active{background:var(--gray-200)}

/* ── S2 ── */
.prog-chip{font-size:13px;font-weight:700;color:var(--gray-600);background:var(--gray-100);padding:5px 12px;border-radius:18px}
.game-area{flex:1;display:flex;flex-direction:column;padding:12px 14px 0;overflow:hidden;min-height:0}
.user-row{display:flex;gap:0;margin-bottom:6px}
.u-chip{flex:1;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;font-weight:700;color:var(--gray-600);background:var(--gray-100);margin:0 2px;transition:all .2s}
.u-chip.active{background:var(--im-pink);color:#fff}
.u-chip.dw{background:var(--im-light-pink);color:var(--im-pink)}
.u-chip.dl{background:var(--gray-200);color:var(--gray-400)}
#ladder-canvas{flex:1;display:block;width:100%;min-height:0}
.dest-row{display:flex;gap:0;margin-top:6px;margin-bottom:10px}
.d-chip{flex:1;height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:12px;font-weight:700;margin:0 2px;background:var(--gray-100);color:var(--gray-400);transition:all .3s;flex-direction:column;gap:1px}
.d-chip .dn{font-size:10px;font-weight:500}
.d-chip.rw{background:var(--im-light-pink);color:var(--im-pink)}
.d-chip.rl{background:var(--gray-200);color:var(--gray-600)}

/* speed bar */
.ctrl-bar{display:flex;gap:8px;align-items:center;padding:10px 14px 32px;flex-shrink:0;background:var(--off-white)}
.sp-lbl{font-size:12px;font-weight:700;color:var(--gray-600);white-space:nowrap}
.sp-grp{display:flex;background:var(--gray-100);border-radius:12px;padding:3px;gap:2px;flex:1}
.sp-pill{flex:1;height:34px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:var(--gray-400);transition:all .18s;font-family:'Noto Sans KR',sans-serif}
.sp-pill.active{background:var(--white);color:var(--im-black);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* shortcut banner */
#sc-banner{position:absolute;left:16px;right:16px;bottom:100px;background:var(--im-pink);color:#fff;border-radius:var(--radius-lg);padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
#sc-banner.show{opacity:1;transform:translateY(0)}

/* ── S3 ── */
.res-hero{margin:18px 18px 0;background:var(--im-pink);border-radius:var(--radius-xl);height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;overflow:hidden}
.res-hero-logo{width:180px;object-fit:contain;filter:brightness(0) invert(1)}
.res-hero-sub{font-size:12px;color:rgba(255,255,255,.85);font-weight:600}
.res-ttl-blk{text-align:center;padding:16px 18px 0}
.res-ttl{font-size:22px;font-weight:700;color:var(--im-black)}
.res-sub{font-size:13px;color:var(--im-pink);font-weight:600;margin-top:3px}
.res-sec{padding:16px 18px 0}
.res-sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.res-sec-ttl{font-size:13px;font-weight:700;color:var(--im-black)}
.replay-btn{font-size:12px;font-weight:600;color:var(--im-pink);background:var(--im-light-pink);border:none;cursor:pointer;padding:5px 10px;border-radius:18px;transition:background .15s;font-family:'Noto Sans KR',sans-serif}
.replay-btn:active{background:#e8a8ac}
.r-card{display:flex;align-items:center;padding:12px 14px;border-radius:var(--radius-md);margin-bottom:7px;gap:10px}
.r-card.win{background:var(--im-light-pink)}
.r-card.lose{background:var(--gray-100)}
.r-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.r-card.win .r-badge{background:var(--im-pink);color:#fff}
.r-card.lose .r-badge{background:var(--gray-400);color:#fff}
.r-name{font-size:15px;font-weight:700;flex:1}
.r-card.win .r-name{color:var(--im-black)}
.r-card.lose .r-name{color:var(--gray-600)}
.r-status{font-size:12px;font-weight:700}
.r-card.win .r-status{color:var(--im-pink)}
.r-card.lose .r-status{color:var(--gray-400)}
.loser-tog{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--gray-100);border-radius:var(--radius-md);cursor:pointer;border:none;width:100%;transition:background .15s;font-family:'Noto Sans KR',sans-serif}
.loser-tog:active{background:var(--gray-200)}
.loser-tog-l{font-size:13px;font-weight:600;color:var(--gray-600)}
.loser-tog-c{font-size:12px;color:var(--gray-400);transition:transform .2s}
.loser-tog-c.open{transform:rotate(180deg)}
.loser-list{overflow:hidden;max-height:0;transition:max-height .3s ease}
.loser-list.open{max-height:500px}
.res-bot{padding:16px 18px 36px;display:flex;gap:10px;background:var(--off-white)}
.res-bot .cta{flex:1;height:52px;font-size:14px}

/* ── S4 replay ── */
.rp-hint{text-align:center;font-size:12px;color:var(--gray-400);padding:6px 18px 0}
.rp-game{flex:1;display:flex;flex-direction:column;padding:10px 14px 0;overflow:hidden;min-height:0}
#replay-canvas{flex:1;display:block;width:100%;min-height:0}
.usr-sel{padding:8px 14px;flex-shrink:0}
.usr-sel-inner{display:flex;background:var(--gray-100);border-radius:12px;padding:3px;gap:2px}
.sel-pill{flex:1;height:36px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:var(--gray-400);transition:all .18s;font-family:'Noto Sans KR',sans-serif}
.sel-pill.active{background:var(--im-pink);color:#fff;box-shadow:0 2px 6px rgba(228,96,98,.35)}

/* ── M1 modal ── */
#modal-ov{position:absolute;inset:0;background:rgba(5,2,2,.55);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;padding:20px}
#modal-ov.show{opacity:1;pointer-events:all}
.modal-box{background:var(--white);border-radius:26px;padding:28px 24px;width:100%;max-width:340px;text-align:center;transform:scale(.9) translateY(10px);transition:transform .25s cubic-bezier(.4,0,.2,1)}
#modal-ov.show .modal-box{transform:scale(1) translateY(0)}
.modal-icon{width:60px;height:60px;background:var(--im-light-pink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.modal-ttl{font-size:17px;font-weight:700;color:var(--im-black);margin-bottom:7px}
.modal-body{font-size:13px;color:var(--gray-600);line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:8px}
.modal-btns .cta{flex:1;height:48px;font-size:14px;border-radius:var(--radius-md)}

/* animations */
@keyframes pop-in{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pop-in{animation:pop-in .22s cubic-bezier(.4,0,.2,1) forwards}
@keyframes cf{0%{opacity:1;transform:translateY(-20px) rotate(0deg)}100%{opacity:0;transform:translateY(80px) rotate(360deg)}}
.cf{position:absolute;width:7px;height:7px;border-radius:2px;animation:cf .75s ease-out forwards;pointer-events:none}
</style>
</head>
<body>
<div id="app">

<!-- S1 설정 -->
<div class="screen" id="s1">
  <div class="sb"><span class="sb-time" id="clk1">9:41</span><span>🔋</span></div>
  <div class="hdr">
    <button class="hdr-btn" onclick="goHome()">✕</button>
    <span class="hdr-title">사다리타기</span>
    <div style="width:38px"></div>
  </div>
  <div class="scroll">
    <div class="hero-box">
      <img class="hero-logo" id="hero-logo" alt="im1l COFFEE">
      <span class="hero-sub">사다리 게임</span>
    </div>
    <div class="title-blk">
      <h1>누가 당첨될까요?</h1>
      <p>인원과 당첨자 수를 정하세요</p>
    </div>
    <div class="steppers-wrap">
      <div class="step-group">
        <div class="step-lbl-row">
          <span class="step-lbl">참여 인원</span>
          <span class="step-helper" id="p-helper">2~10명</span>
        </div>
        <div class="stepper">
          <button class="s-btn" id="p-minus" onclick="adjP(-1)">−</button>
          <span class="s-val" id="p-val">6</span>
          <button class="s-btn" id="p-plus"  onclick="adjP(1)">+</button>
        </div>
      </div>
      <div class="step-group">
        <div class="step-lbl-row">
          <span class="step-lbl">당첨자 수</span>
          <span class="step-helper" id="w-helper">최대 5명</span>
        </div>
        <div class="stepper">
          <button class="s-btn" id="w-minus" onclick="adjW(-1)">−</button>
          <span class="s-val" id="w-val">2</span>
          <button class="s-btn" id="w-plus"  onclick="adjW(1)">+</button>
        </div>
      </div>
    </div>
  </div>
  <div class="bot">
    <button class="cta prime" onclick="startGame()">시작하기 🎯</button>
  </div>
</div>

<!-- S2 사다리 진행 -->
<div class="screen hidden" id="s2">
  <div class="sb"><span class="sb-time" id="clk2">9:41</span><span>🔋</span></div>
  <div class="hdr">
    <button class="hdr-btn" onclick="reqExit()">✕</button>
    <span class="prog-chip" id="prog-ttl">1 / 6 진행 중</span>
    <div style="width:38px"></div>
  </div>
  <div class="game-area" id="s2-area">
    <div class="user-row" id="user-row"></div>
    <canvas id="ladder-canvas"></canvas>
    <div class="dest-row" id="dest-row"></div>
  </div>
  <div class="ctrl-bar">
    <span class="sp-lbl">속도</span>
    <div class="sp-grp">
      <button class="sp-pill active" onclick="setSpd(1,this)">1x</button>
      <button class="sp-pill" onclick="setSpd(2,this)">2x</button>
      <button class="sp-pill" onclick="setSpd(0,this)">즉시</button>
    </div>
  </div>
  <div id="sc-banner"><span>🎉</span><span id="sc-txt">당첨자가 모두 결정됐어요!</span></div>
</div>

<!-- S3 결과 -->
<div class="screen hidden" id="s3">
  <div class="sb"><span class="sb-time" id="clk3">9:41</span><span>🔋</span></div>
  <div class="hdr">
    <div style="width:38px"></div>
    <span class="hdr-title">결과 발표</span>
    <button class="hdr-btn" onclick="goHome()">✕</button>
  </div>
  <div class="scroll" id="s3-content">
    <div class="res-hero">
      <img class="res-hero-logo" id="res-logo" alt="im1l COFFEE">
      <span class="res-hero-sub">당첨자 발표 🎉</span>
    </div>
    <div class="res-ttl-blk">
      <div class="res-ttl">축하합니다!</div>
      <div class="res-sub" id="res-sub"></div>
    </div>
    <div class="res-sec">
      <div class="res-sec-hdr">
        <span class="res-sec-ttl" id="win-ttl">당첨 · 0명</span>
        <button class="replay-btn" onclick="goReplay()">↻ 사다리 다시 보기</button>
      </div>
      <div id="win-cards"></div>
    </div>
    <div class="res-sec" style="padding-bottom:0">
      <div class="res-sec-hdr">
        <span class="res-sec-ttl" id="lose-ttl" style="color:var(--gray-600)">미당첨 · 0명</span>
      </div>
      <button class="loser-tog" onclick="togLosers()">
        <span class="loser-tog-l" id="lose-names"></span>
        <span class="loser-tog-c" id="lose-chev">▼</span>
      </button>
      <div class="loser-list" id="lose-list"></div>
    </div>
    <div style="height:16px"></div>
  </div>
  <div class="res-bot">
    <button class="cta sec" onclick="goHome()">새로 설정</button>
    <button class="cta prime" onclick="replaySame()">같은 조건으로 다시</button>
  </div>
</div>

<!-- S4 리플레이 -->
<div class="screen hidden" id="s4">
  <div class="sb"><span class="sb-time" id="clk4">9:41</span><span>🔋</span></div>
  <div class="hdr">
    <button class="hdr-btn" onclick="goTo('s3')">←</button>
    <span class="hdr-title">사다리 리플레이</span>
    <div style="width:38px"></div>
  </div>
  <p class="rp-hint">번호를 탭해 궤적을 확인하세요</p>
  <div class="rp-game">
    <div class="user-row" id="rp-user-row"></div>
    <canvas id="replay-canvas"></canvas>
    <div class="dest-row" id="rp-dest-row"></div>
  </div>
  <div class="usr-sel"><div class="usr-sel-inner" id="sel-pills"></div></div>
  <div class="bot" style="padding-top:10px">
    <button class="cta sec" onclick="goTo('s3')">결과로 돌아가기</button>
  </div>
</div>

<!-- M1 모달 -->
<div id="modal-ov" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-icon">⚠️</div>
    <div class="modal-ttl">게임을 종료하시겠어요?</div>
    <div class="modal-body">진행 중인 결과는 사라집니다.</div>
    <div class="modal-btns">
      <button class="cta sec" onclick="hideModal()">계속하기</button>
      <button class="cta prime" onclick="confirmExit()">종료</button>
    </div>
  </div>
</div>

<script>
// ── 로고 삽입 ──
document.getElementById('hero-logo').src = LOGO_DATA;
document.getElementById('res-logo').src = LOGO_DATA;

// ── 상태 ──
const S = {
  players:6, winners:2, speed:1,
  cur:0, running:false, af:null,
  ld:null, results:[], rpUser:0,
  cur_screen:'s1', prev_screen:null
};
let revealed = new Set();
let allDone = false;

// ── 시계 ──
function tick(){
  const t=new Date();
  const s=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
  ['clk1','clk2','clk3','clk4'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=s});
}
tick(); setInterval(tick,15000);

// ── 화면 전환 ──
function goTo(scr, slideOut=true){
  const prev=document.getElementById(S.cur_screen);
  const next=document.getElementById(scr);
  if(!next||scr===S.cur_screen)return;
  if(slideOut)prev.classList.add('slide-out');
  else prev.classList.add('hidden');
  next.classList.remove('hidden','slide-out');
  S.prev_screen=S.cur_screen; S.cur_screen=scr;
  setTimeout(()=>{ if(slideOut)prev.classList.replace('slide-out','hidden'); },360);
}
function goHome(){ stopAnim(); goTo('s1',false); resetS1(); }

// ── S1 ──
function adjP(d){
  const n=S.players+d;
  if(n<2||n>10)return;
  S.players=n;
  if(S.winners>=n)S.winners=n-1;
  renderS1();
}
function adjW(d){
  const n=S.winners+d;
  if(n<1||n>=S.players)return;
  S.winners=n; renderS1();
}
function renderS1(){
  document.getElementById('p-val').textContent=S.players;
  document.getElementById('w-val').textContent=S.winners;
  document.getElementById('w-helper').textContent='최대 '+(S.players-1)+'명';
  setDis('p-minus',S.players<=2); setDis('p-plus',S.players>=10);
  setDis('w-minus',S.winners<=1); setDis('w-plus',S.winners>=S.players-1);
}
function setDis(id,v){ document.getElementById(id).classList.toggle('dis',v); }
function resetS1(){ S.players=6; S.winners=2; renderS1(); }
renderS1();

// ── 사다리 생성 ──
function genLadder(n, wc){
  const rowCount = Math.ceil(n*1.5)+2;
  const rows=[];
  for(let r=0;r<rowCount;r++){
    const used=new Set(); const rr=[];
    for(let c=0;c<n-1;c++){
      if(!used.has(c)&&!used.has(c+1)&&Math.random()>0.45){
        rr.push(c); used.add(c); used.add(c+1);
      }
    }
    rows.push(rr);
  }
  // 각 열의 최종 도착지 추적 (수직+수평 직각 이동만)
  const finalDest=Array(n).fill(0);
  const paths={};
  for(let col=0;col<n;col++){
    let cur=col;
    // 경로는 {col, row, type} 배열 - type: 'v'=수직, 'h'=수평
    const path=[{col:cur, row:0}];
    for(let r=0;r<rows.length;r++){
      const rr=rows[r];
      if(rr.includes(cur)){
        // 먼저 수직으로 이 가로선 높이까지
        // 그 다음 수평으로 오른쪽으로
        path.push({col:cur, row:r+1});      // 수직 이동 완료 지점
        cur=cur+1;
        path.push({col:cur, row:r+1});      // 수평 이동 완료 지점
      } else if(rr.includes(cur-1)){
        path.push({col:cur, row:r+1});      // 수직
        cur=cur-1;
        path.push({col:cur, row:r+1});      // 수평(왼쪽)
      } else {
        path.push({col:cur, row:r+1});      // 수직만
      }
    }
    paths[col]=path;
    finalDest[col]=cur;
  }
  // 당첨 도착지 결정
  const dests=[...Array(n).keys()].sort(()=>Math.random()-.5);
  const winDests=new Set(dests.slice(0,wc));
  const results=Array(n).fill('lose');
  for(let col=0;col<n;col++){
    if(winDests.has(finalDest[col]))results[col]='win';
  }
  // 당첨 수 보정
  const got=results.filter(r=>r==='win').length;
  if(got!==wc){
    results.fill('lose');
    const seen=new Set(); let cnt=0;
    for(let col=0;col<n&&cnt<wc;col++){
      const d=finalDest[col];
      if(!seen.has(d)){results[col]='win';seen.add(d);cnt++;}
    }
  }
  return {rows,paths,finalDest,results};
}

// ── 그리기 ──
function drawLadder(cid, ld, n, hlCol=-1, revCols=new Set(), prog=1){
  const cv=document.getElementById(cid); if(!cv)return;
  const ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const {rows,paths,finalDest}=ld;
  const rc=rows.length;
  const colW=W/n, rowH=H/(rc+1);
  const cx=c=>colW*c+colW/2;
  const cy=r=>rowH*(r+1);
  // 수직선
  ctx.strokeStyle='#ddd'; ctx.lineWidth=2;
  for(let c=0;c<n;c++){ctx.beginPath();ctx.moveTo(cx(c),cy(0));ctx.lineTo(cx(c),cy(rc));ctx.stroke();}
  // 가로선
  ctx.strokeStyle='#ccc'; ctx.lineWidth=2.5;
  rows.forEach((rr,r)=>rr.forEach(c=>{
    ctx.beginPath();ctx.moveTo(cx(c),cy(r+1));ctx.lineTo(cx(c+1),cy(r+1));ctx.stroke();
  }));
  // 완료된 열 궤적
  revCols.forEach(col=>{
    if(col===hlCol)return;
    const color=ld.results[col]==='win'?'#F3BCC0':'#e0e0e0';
    drawPath(ctx,paths[col],cx,cy,color,2,1);
  });
  // 현재 진행 열
  if(hlCol>=0&&paths[hlCol]){
    drawPath(ctx,paths[hlCol],cx,cy,'#E46062',4,prog);
    if(prog<1){
      const pl=paths[hlCol].length-1;
      const pi=Math.min(Math.floor(prog*pl),pl-1);
      const p0=paths[hlCol][pi], p1=paths[hlCol][Math.min(pi+1,pl)];
      const fr=(prog*pl)-pi;
      const dx=cx(p0.col)+(cx(p1.col)-cx(p0.col))*fr;
      const dy=cy(p0.row)+(cy(p1.row)-cy(p0.row))*fr;
      ctx.beginPath();ctx.arc(dx,dy,7,0,Math.PI*2);
      ctx.fillStyle='#E46062';ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();
    }
  }
}

function drawPath(ctx,path,cx,cy,color,lw,prog){
  if(!path||path.length<2)return;
  const total=path.length-1;
  const drawTo=prog*total;
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(cx(path[0].col),cy(path[0].row));
  for(let i=0;i<total;i++){
    if(i>=drawTo)break;
    const p0=path[i],p1=path[i+1];
    const fr=Math.min(1,drawTo-i);
    // 수평 이동: y 고정, 수직 이동: x 고정
    const sameRow=(p0.row===p1.row);
    let tx,ty;
    if(sameRow){
      // 수평: y는 고정, x만 이동
      tx=cx(p0.col)+(cx(p1.col)-cx(p0.col))*fr;
      ty=cy(p0.row);
    } else {
      // 수직: x는 고정, y만 이동
      tx=cx(p0.col);
      ty=cy(p0.row)+(cy(p1.row)-cy(p0.row))*fr;
    }
    ctx.lineTo(tx,ty);
  }
  ctx.stroke();
}

// ── S2 게임 흐름 ──
let animProg=0, animStart=null;

function startGame(){
  S.ld=genLadder(S.players,S.winners);
  S.results=S.ld.results;
  S.cur=0; revealed=new Set(); allDone=false;
  buildUserRow(S.players); buildDestRow(S.players);
  updateProg();
  goTo('s2');
  setTimeout(()=>{ resizeCv('ladder-canvas'); drawLadder('ladder-canvas',S.ld,S.players,-1,revealed); runNext(); },390);
}

function buildUserRow(n){
  const row=document.getElementById('user-row'); row.innerHTML='';
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='u-chip'; c.id='uc'+i; c.textContent=i+1; row.appendChild(c);
  }
}
function buildDestRow(n){
  const row=document.getElementById('dest-row'); row.innerHTML='';
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='d-chip'; c.id='dc'+i;
    c.innerHTML='<span>?</span><span class="dn">'+(i+1)+'</span>'; row.appendChild(c);
  }
}
function updateProg(){ document.getElementById('prog-ttl').textContent=(S.cur+1)+' / '+S.players+' 진행 중'; }

function runNext(){
  if(allDone)return;
  const col=S.cur, n=S.players;
  for(let i=0;i<n;i++){
    const c=document.getElementById('uc'+i);
    if(i<col){ c.classList.remove('active'); c.classList.add(S.results[i]==='win'?'dw':'dl'); }
    else if(i===col){ c.classList.remove('dw','dl'); c.classList.add('active'); }
    else c.classList.remove('active','dw','dl');
  }
  if(S.speed===0){
    revealed.add(col); revealDest(col);
    drawLadder('ladder-canvas',S.ld,n,-1,revealed);
    finishUser(col); return;
  }
  const rc=S.ld.rows.length;
  const pl=S.ld.paths[col].length;
  const dur=(1200/rc*pl)/S.speed;
  animProg=0; animStart=null; S.running=true;
  function step(ts){
    if(!animStart)animStart=ts;
    animProg=Math.min((ts-animStart)/dur,1);
    drawLadder('ladder-canvas',S.ld,n,col,revealed,animProg);
    if(animProg<1){ S.af=requestAnimationFrame(step); }
    else{ revealed.add(col); revealDest(col); drawLadder('ladder-canvas',S.ld,n,-1,revealed); finishUser(col); }
  }
  S.af=requestAnimationFrame(step);
}

function revealDest(col){
  const dc=S.ld.finalDest[col];
  const chip=document.getElementById('dc'+dc);
  const win=S.results[col]==='win';
  chip.classList.add(win?'rw':'rl');
  chip.innerHTML='<span>'+(win?'당첨':'꽝')+'</span><span class="dn">'+(dc+1)+'</span>';
  chip.classList.add('pop-in'); setTimeout(()=>chip.classList.remove('pop-in'),300);
}

function finishUser(col){
  S.running=false;
  const wc=S.results.filter(r=>r==='win').length;
  const dw=[...revealed].filter(c=>S.results[c]==='win').length;
  if(dw>=wc&&!allDone){
    allDone=true;
    const rem=S.players-revealed.size;
    if(rem>0){
      const b=document.getElementById('sc-banner'); b.classList.add('show');
      setTimeout(()=>{
        b.classList.remove('show');
        for(let i=0;i<S.players;i++){
          if(!revealed.has(i)){ document.getElementById('uc'+i).classList.add('dl'); revealed.add(i); }
        }
        drawLadder('ladder-canvas',S.ld,S.players,-1,revealed);
        setTimeout(()=>goToRes(),600);
      },1500);
    } else setTimeout(()=>goToRes(),400);
    return;
  }
  if(col+1<S.players){ S.cur=col+1; updateProg(); setTimeout(()=>runNext(), S.speed===0?0:400/S.speed); }
  else setTimeout(()=>goToRes(),400);
}

function setSpd(v,btn){ S.speed=v; document.querySelectorAll('.sp-pill').forEach(p=>p.classList.remove('active')); btn.classList.add('active'); }
function stopAnim(){ if(S.af)cancelAnimationFrame(S.af); S.running=false; }

// ── S3 결과 ──
function goToRes(){
  const n=S.players;
  const winners=[],losers=[];
  for(let i=0;i<n;i++)(S.results[i]==='win'?winners:losers).push(i);
  document.getElementById('res-sub').textContent=winners.length+'명이 당첨됐어요';
  document.getElementById('win-ttl').textContent='당첨 · '+winners.length+'명';
  document.getElementById('lose-ttl').textContent='미당첨 · '+losers.length+'명';
  const wc=document.getElementById('win-cards'); wc.innerHTML='';
  winners.forEach(i=>{
    const el=document.createElement('div');
    el.className='r-card win pop-in';
    el.innerHTML='<div class="r-badge">'+(i+1)+'</div><div class="r-name">'+(i+1)+'번</div><div class="r-status">✓ 당첨</div>';
    wc.appendChild(el);
  });
  document.getElementById('lose-names').textContent=losers.map(i=>i+1+'번').join(', ');
  const ll=document.getElementById('lose-list'); ll.innerHTML='';
  losers.forEach(i=>{
    const el=document.createElement('div');
    el.className='r-card lose'; el.style.marginTop='7px';
    el.innerHTML='<div class="r-badge">'+(i+1)+'</div><div class="r-name">'+(i+1)+'번</div><div class="r-status">미당첨</div>';
    ll.appendChild(el);
  });
  document.getElementById('lose-list').classList.remove('open');
  document.getElementById('lose-chev').classList.remove('open');
  goTo('s3'); launchConfetti();
}

function togLosers(){
  document.getElementById('lose-list').classList.toggle('open');
  document.getElementById('lose-chev').classList.toggle('open');
}
function replaySame(){
  stopAnim(); S.cur=0; revealed=new Set(); allDone=false;
  S.ld=genLadder(S.players,S.winners); S.results=S.ld.results;
  buildUserRow(S.players); buildDestRow(S.players); updateProg();
  goTo('s2',false);
  setTimeout(()=>{ resizeCv('ladder-canvas'); drawLadder('ladder-canvas',S.ld,S.players,-1,revealed); runNext(); },390);
}

// ── S4 리플레이 ──
function goReplay(){
  const n=S.players;
  const rrow=document.getElementById('rp-user-row'); rrow.innerHTML='';
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='u-chip '+(S.results[i]==='win'?'dw':'dl'); c.textContent=i+1; rrow.appendChild(c);
  }
  const drow=document.getElementById('rp-dest-row'); drow.innerHTML='';
  for(let i=0;i<n;i++){
    const sc=S.ld.finalDest.indexOf(i);
    const win=sc>=0&&S.results[sc]==='win';
    const c=document.createElement('div');
    c.className='d-chip '+(win?'rw':'rl');
    c.innerHTML='<span>'+(win?'당첨':'꽝')+'</span><span class="dn">'+(i+1)+'</span>';
    drow.appendChild(c);
  }
  const pills=document.getElementById('sel-pills'); pills.innerHTML='';
  for(let i=0;i<n;i++){
    const p=document.createElement('button');
    p.className='sel-pill'+(i===0?' active':''); p.textContent=i+1;
    p.onclick=(()=>{const x=i;return()=>selRpUser(x);})(); pills.appendChild(p);
  }
  S.rpUser=0; goTo('s4');
  setTimeout(()=>{ resizeCv('replay-canvas'); drawReplay(0); },390);
}
function selRpUser(col){
  S.rpUser=col;
  document.querySelectorAll('.sel-pill').forEach((p,i)=>p.classList.toggle('active',i===col));
  drawReplay(col);
}
function drawReplay(col){
  const all=new Set(Array.from({length:S.players},(_,i)=>i));
  drawLadder('replay-canvas',S.ld,S.players,col,all,1);
}

// ── M1 모달 ──
function reqExit(){
  if(!S.running&&revealed.size===0){goHome();return;}
  stopAnim(); document.getElementById('modal-ov').classList.add('show');
}
function hideModal(){
  document.getElementById('modal-ov').classList.remove('show');
  if(!allDone&&S.cur<S.players&&revealed.size<=S.cur)runNext();
}
function confirmExit(){ document.getElementById('modal-ov').classList.remove('show'); goHome(); }
function closeModal(e){ if(e.target.id==='modal-ov')hideModal(); }

// ── 컨페티 ──
function launchConfetti(){
  const app=document.getElementById('app');
  const cols=['#E46062','#F3BCC0','#ff9999','#ffb3c1','#fff','#FFF8EE'];
  for(let i=0;i<24;i++){
    const el=document.createElement('div'); el.className='cf';
    el.style.cssText='left:'+Math.random()*100+'%;top:'+(15+Math.random()*30)+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+';animation-delay:'+Math.random()*.4+'s;animation-duration:'+(0.6+Math.random()*.5)+'s;';
    app.appendChild(el); setTimeout(()=>el.remove(),1200);
  }
}

// ── 캔버스 리사이즈 ──
function resizeCv(id){ const c=document.getElementById(id); if(!c)return; const r=c.getBoundingClientRect(); c.style.width=r.width+'px'; c.style.height=r.height+'px'; }
window.addEventListener('resize',()=>{
  if(S.cur_screen==='s2'&&S.ld){resizeCv('ladder-canvas');drawLadder('ladder-canvas',S.ld,S.players,-1,revealed);}
  if(S.cur_screen==='s4'&&S.ld){resizeCv('replay-canvas');drawReplay(S.rpUser);}
});
</script>
